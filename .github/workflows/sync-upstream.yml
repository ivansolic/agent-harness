name: Sync upstream skills

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull upstream skills
        run: bash scripts/sync.sh

      - name: Open pull request if anything changed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/upstream
          git add -A
          git commit -m "Sync upstream skills"
          git push --force origin sync/upstream
          if [ -z "$(gh pr list --head sync/upstream --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head sync/upstream \
              --title "Sync upstream skills" \
              --body "New versions of the skills from their source repos. Review the diff before merging: these are instructions your agent will follow."
          fi
